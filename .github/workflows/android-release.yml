name: Android APK Build

on:
  push:
    branches:
      - main
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.10"

      - name: Build APKs
        run: |
          gradle clean assembleDebug assembleRelease

      - name: Show APK outputs
        run: |
          echo "APK files:"
          find app/build/outputs/apk -type f -name "*.apk" -print

      - name: Prepare artifact files
        run: |
          mkdir -p release-files
          DEBUG_APK=$(find app/build/outputs/apk/debug -type f -name "*.apk" | head -n 1)
          RELEASE_APK=$(find app/build/outputs/apk/release -type f -name "*.apk" | head -n 1)

          if [ -z "$DEBUG_APK" ]; then
            echo "Debug APK not found"
            exit 1
          fi

          if [ -z "$RELEASE_APK" ]; then
            echo "Release APK not found"
            exit 1
          fi

          cp "$DEBUG_APK" release-files/ZaEditor-debug.apk
          cp "$RELEASE_APK" release-files/ZaEditor-release.apk

      - name: Upload APK artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ZaEditor-APK
          path: release-files/*.apk
          if-no-files-found: error

      - name: Prepare release APK for tag
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          TAG_NAME="${GITHUB_REF_NAME}"
          cp release-files/ZaEditor-release.apk "release-files/ZaEditor-${TAG_NAME}.apk"
          ls -lah release-files/

      - name: Create GitHub Release and upload APK
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          name: Za Editor ${{ github.ref_name }}
          tag_name: ${{ github.ref_name }}
          files: release-files/ZaEditor-${{ github.ref_name }}.apk
          fail_on_unmatched_files: true
