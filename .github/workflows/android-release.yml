name: Android APK Build & Release

on:
  push:
    branches: ["main"]
    tags: ["v*"]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.14.3

      - name: Build APKs
        run: gradle clean assembleDebug assembleRelease

      - name: Rename APKs for non-tag builds
        if: ${{ !startsWith(github.ref, 'refs/tags/v') }}
        run: |
          cp app/build/outputs/apk/debug/app-debug.apk app/build/outputs/apk/debug/ZaEditor-debug.apk
          cp app/build/outputs/apk/release/app-release.apk app/build/outputs/apk/release/ZaEditor-release.apk

      - name: Upload APK artifacts
        uses: actions/upload-artifact@v4
        with:
          name: apk-artifacts
          path: |
            app/build/outputs/apk/debug/*.apk
            app/build/outputs/apk/release/*.apk

      - name: Rename release APK for tag
        if: ${{ startsWith(github.ref, 'refs/tags/v') }}
        run: |
          TAG_NAME=${GITHUB_REF_NAME}
          cp app/build/outputs/apk/release/app-release.apk app/build/outputs/apk/release/ZaEditor-${TAG_NAME}.apk

      - name: Create GitHub Release
        if: ${{ startsWith(github.ref, 'refs/tags/v') }}
        uses: softprops/action-gh-release@v2
        with:
          files: app/build/outputs/apk/release/ZaEditor-${{ github.ref_name }}.apk
