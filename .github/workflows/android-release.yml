name: Android APK Build

on:
  push:
    branches:
      - main
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      release_tag:
        description: "Opsional. Isi contoh v1.0.1 jika ingin upload APK ke GitHub Release dari manual run."
        required: false
        default: ""

permissions:
  contents: write

jobs:
  build:
    name: Build APK
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.10"

      - name: Build APKs
        shell: bash
        run: |
          set -euo pipefail
          gradle clean assembleDebug assembleRelease

      - name: Show APK outputs
        shell: bash
        run: |
          set -euo pipefail
          echo "APK files generated:"
          find app/build/outputs/apk -type f -name "*.apk" -print -exec ls -lh {} \;

      - name: Determine release variables
        id: release_vars
        shell: bash
        env:
          INPUT_RELEASE_TAG: ${{ github.event.inputs.release_tag || '' }}
        run: |
          set -euo pipefail

          RELEASE_TAG=""
          SHOULD_RELEASE="false"

          if [[ "${GITHUB_REF_TYPE}" == "tag" && "${GITHUB_REF_NAME}" == v* ]]; then
            RELEASE_TAG="${GITHUB_REF_NAME}"
            SHOULD_RELEASE="true"
          fi

          if [[ "${GITHUB_EVENT_NAME}" == "workflow_dispatch" && -n "${INPUT_RELEASE_TAG}" ]]; then
            RELEASE_TAG="${INPUT_RELEASE_TAG}"
            SHOULD_RELEASE="true"
          fi

          echo "release_tag=${RELEASE_TAG}" >> "$GITHUB_OUTPUT"
          echo "should_release=${SHOULD_RELEASE}" >> "$GITHUB_OUTPUT"

          echo "Event name: ${GITHUB_EVENT_NAME}"
          echo "Ref type: ${GITHUB_REF_TYPE}"
          echo "Ref name: ${GITHUB_REF_NAME}"
          echo "Should release: ${SHOULD_RELEASE}"
          echo "Release tag: ${RELEASE_TAG}"

      - name: Prepare APK files
        shell: bash
        env:
          RELEASE_TAG: ${{ steps.release_vars.outputs.release_tag }}
        run: |
          set -euo pipefail

          mkdir -p release-files

          DEBUG_APK="$(find app/build/outputs/apk/debug -type f -name "*.apk" | head -n 1 || true)"
          RELEASE_APK="$(find app/build/outputs/apk/release -type f -name "*.apk" | head -n 1 || true)"

          if [[ -z "${DEBUG_APK}" ]]; then
            echo "::error::Debug APK not found"
            exit 1
          fi

          if [[ -z "${RELEASE_APK}" ]]; then
            echo "::error::Release APK not found"
            exit 1
          fi

          cp "${DEBUG_APK}" release-files/ZaEditor-debug.apk
          cp "${RELEASE_APK}" release-files/ZaEditor-release.apk

          if [[ -n "${RELEASE_TAG}" ]]; then
            cp "${RELEASE_APK}" "release-files/ZaEditor-${RELEASE_TAG}.apk"
          fi

          echo "Prepared APK files:"
          ls -lah release-files/

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: ZaEditor-APK
          path: release-files/*.apk
          if-no-files-found: error

      - name: Create or update GitHub Release
        if: steps.release_vars.outputs.should_release == 'true'
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ steps.release_vars.outputs.release_tag }}
        run: |
          set -euo pipefail

          APK_FILE="release-files/ZaEditor-${RELEASE_TAG}.apk"

          if [[ ! -f "${APK_FILE}" ]]; then
            echo "::error::Release APK file not found: ${APK_FILE}"
            exit 1
          fi

          echo "Repository: ${GH_REPO}"
          echo "Release tag: ${RELEASE_TAG}"
          echo "APK file: ${APK_FILE}"
          ls -lah "${APK_FILE}"

          gh auth status --hostname github.com

          if gh release view "${RELEASE_TAG}" --repo "${GH_REPO}" >/dev/null 2>&1; then
            echo "Release already exists: ${RELEASE_TAG}"
          else
            echo "Creating GitHub Release: ${RELEASE_TAG}"
            gh release create "${RELEASE_TAG}" \
              --repo "${GH_REPO}" \
              --title "Za Editor ${RELEASE_TAG}" \
              --notes "Automated APK release for Za Editor ${RELEASE_TAG}" \
              --target "${GITHUB_SHA}"
          fi

          echo "Uploading APK asset to release..."
          gh release upload "${RELEASE_TAG}" "${APK_FILE}" \
            --repo "${GH_REPO}" \
            --clobber

          echo "Verifying release assets..."
          gh release view "${RELEASE_TAG}" \
            --repo "${GH_REPO}" \
            --json tagName,name,assets

          echo "APK uploaded to GitHub Release successfully."
